<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Fat Pepper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #8f9752; overflow: hidden; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #world, #game { position: fixed; inset: 0; }
      canvas { display: block; }
      #build { position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(6px + env(safe-area-inset-bottom));
        font: 10px/1 "Nunito", system-ui, sans-serif; color: #2b2118; opacity: 0.45; pointer-events: none; z-index: 10; }
      /* Loading screen: plain HTML so it shows before the game's code has even downloaded. */
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: #9fcfc6 radial-gradient(circle, #b6dcd4 0 5px, transparent 6px) 0 0 / 34px 34px;
        font-family: "Nunito", system-ui, sans-serif; color: #3d4148; transition: opacity 0.45s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .card { width: min(320px, calc(100vw - 32px)); box-sizing: border-box; padding: 26px 24px 22px; text-align: center;
        background: #fbf4e4; border-radius: 22px; box-shadow: 0 8px 0 rgba(61, 65, 72, 0.18); }
      #loading h1 { margin: 0 0 4px; font: 400 40px/1.05 "Lilita One", system-ui, sans-serif; color: #fbf4e4;
        -webkit-text-stroke: 7px #d07a62; paint-order: stroke fill; letter-spacing: 0.5px; }
      #loading svg { display: block; width: 132px; height: 88px; margin: 6px auto 10px; }
      #loading .pepper { animation: waddle 0.5s ease-in-out infinite alternate; transform-origin: 66px 80px; }
      #loading .shadow { animation: squish 0.5s ease-in-out infinite alternate; transform-origin: 66px 82px; }
      #loading .bar { height: 14px; border-radius: 7px; background: #e9dfc6; overflow: hidden; }
      #loading .fill { height: 100%; width: 4%; border-radius: 7px; background: #ef9a7a; transition: width 0.35s ease;
        animation: creep 12s cubic-bezier(0.1, 0.6, 0.3, 1) forwards; }
      #loading .fill.known { animation: none; }
      #loading .status { margin-top: 10px; font-size: 14px; font-weight: 700; min-height: 1.3em; }
      @keyframes waddle { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-3px); } }
      @keyframes squish { from { transform: scaleX(1); } to { transform: scaleX(0.88); } }
      @keyframes creep { to { width: 45%; } }
      @media (prefers-reduced-motion: reduce) { #loading .pepper, #loading .shadow { animation: none; } }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="game"></div>
    <div id="build"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="card">
        <h1>Fat Pepper</h1>
        <svg viewBox="0 0 132 88" aria-hidden="true">
          <ellipse class="shadow" cx="66" cy="82" rx="36" ry="5" fill="#3d4148" opacity="0.15" />
          <g class="pepper">
            <path d="M26 46 Q12 40 14 28" stroke="#3b3d45" stroke-width="9" stroke-linecap="round" fill="none" />
            <ellipse cx="62" cy="56" rx="36" ry="24" fill="#3b3d45" />
            <ellipse cx="66" cy="64" rx="22" ry="14" fill="#fbfaf6" />
            <rect x="40" y="70" width="10" height="12" rx="5" fill="#3b3d45" />
            <rect x="76" y="70" width="10" height="12" rx="5" fill="#fbfaf6" />
            <circle cx="96" cy="38" r="19" fill="#3b3d45" />
            <path d="M96 22 Q90 38 98 56 L110 50 Q104 36 96 22 Z" fill="#fbfaf6" />
            <ellipse cx="110" cy="44" rx="9" ry="7" fill="#fbfaf6" />
            <circle cx="117" cy="42" r="3" fill="#3b3d45" />
            <path d="M84 24 Q78 12 86 10 Q92 16 92 22 Z" fill="#3b3d45" />
            <path d="M102 21 Q108 9 114 13 Q110 22 106 25 Z" fill="#3b3d45" />
            <circle cx="102" cy="35" r="2.6" fill="#fbfaf6" /><circle cx="102.6" cy="35" r="1.4" fill="#3b3d45" />
            <path d="M80 50 Q92 58 104 54" stroke="#e0685f" stroke-width="5" stroke-linecap="round" fill="none" />
            <circle cx="92" cy="58" r="3.5" fill="#f6d77a" />
          </g>
        </svg>
        <div class="bar"><div class="fill"></div></div>
        <div class="status">Fetching the food bowl…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
